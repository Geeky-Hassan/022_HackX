<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900.91 580.51" width="900" height="580" role="img" aria-label="Logo loader">
  <defs>
    <style>
      :root{
        --blue: #1d68ff;
        --dark: #3f3f43;
        --dash-big: 3600;   /* stroke length assumed for big paths */
        --dash-sm: 800;     /* stroke length for rect */
        --draw-ease: cubic-bezier(.2,.9,.3,1);
        --flow-ease: cubic-bezier(.4,0,.2,1);
      }

      /* common */
      .logo * { vector-effect: non-scaling-stroke; }
      .logo { transform-box: fill-box; transform-origin: center; }

      /* outline shapes (m and p) */
      .outline {
        fill: none;
        stroke: var(--blue);
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: var(--dash-big);
        stroke-dashoffset: var(--dash-big);
        /* compose 2 animations: drawIn (one-time, handles initial pop-in + draw),
           and flow (looping, alternates between drawn and undrawn) */
        animation-name: drawIn, flow;
        animation-duration: 1.05s, 3.6s;
        animation-timing-function: var(--draw-ease), var(--flow-ease);
        animation-fill-mode: forwards, none;
        animation-iteration-count: 1, infinite;
        animation-direction: normal, alternate;
        will-change: stroke-dashoffset, transform, opacity;
      }

      /* the dark vertical bar in the middle */
      .bar {
        fill: var(--dark);
        stroke: var(--blue);
        stroke-width: 8;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: var(--dash-sm);
        stroke-dashoffset: var(--dash-sm);
        animation-name: drawInBar, flowBar;
        animation-duration: 0.9s, 3.6s;
        animation-timing-function: var(--draw-ease), var(--flow-ease);
        animation-fill-mode: forwards, none;
        animation-iteration-count: 1, infinite;
        animation-direction: normal, alternate;
        will-change: stroke-dashoffset, transform, opacity;
      }

      /* stagger initial draw and loop start for nicer sequencing */
      .s0 { animation-delay: 0s, 1.4s; }   /* left path */
      .s1 { animation-delay: 0.35s, 1.75s; }/* bar */
      .s2 { animation-delay: 0.7s, 2.05s; } /* right path */

      /* initial draw: pop + draw stroke */
      @keyframes drawIn {
        0%   { stroke-dashoffset: var(--dash-big); transform: scale(0.96) translateY(10px); opacity: 0.98;}
        60%  { stroke-dashoffset: 0; transform: scale(1.03) translateY(-6px); opacity: 1;}
        80%  { transform: scale(0.99) translateY(3px); }
        100% { stroke-dashoffset: 0; transform: scale(1) translateY(0); opacity: 1;}
      }
      @keyframes drawInBar {
        0%   { stroke-dashoffset: var(--dash-sm); transform: scaleY(0.96) translateY(14px); opacity: 0.98; }
        55%  { stroke-dashoffset: 0; transform: scaleY(1.02) translateY(-6px); opacity: 1; }
        85%  { transform: scaleY(0.995) translateY(2px); }
        100% { stroke-dashoffset: 0; transform: scaleY(1) translateY(0); opacity: 1; }
      }

      /* looping flow: un-draw then re-draw (alternate) to create a 'deanimate' that repeats */
      @keyframes flow {
        0%   { stroke-dashoffset: 0; opacity: 1; }
        50%  { stroke-dashoffset: var(--dash-big); opacity: 0.90; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes flowBar {
        0%   { stroke-dashoffset: 0; opacity: 1; }
        50%  { stroke-dashoffset: var(--dash-sm); opacity: 0.88; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .outline, .bar { animation: none !important; stroke-dashoffset: 0; transform: none; opacity: 1; }
      }
    </style>
  </defs>

  <g id="Layer_1-2" data-name="Layer 1" class="logo" aria-hidden="false">
    <g>
      <!-- left shape (m) -->
      <path class="outline s0"
        d="M682.88,3.29c-51.65,0-99.15,18.06-136.54,48.19,5.04,7.59,9.75,15.42,14.08,23.41,15.64,28.84,23.25,53.73,26.39,66,1.5,5.88,2.8,11.8,3.9,17.77,20.09-29.45,53.91-48.83,92.17-48.83,61.48,0,111.5,50.02,111.5,111.5s-50.02,111.5-111.5,111.5c-44.37,0-82.77-26.06-100.71-63.67v145.5c30.14,15.77,64.4,24.7,100.71,24.7,120.22,0,218.03-97.81,218.03-218.03S803.1,3.29,682.88,3.29Z"/>
      <!-- center bar -->
      <rect class="bar s1" x="463.4" y="187.38" width="94.82" height="393.12"/>
      <!-- right shape (p) -->
      <path class="outline s2"
        d="M556.75,138.38c-1.38-12.1-4.27-23.28-8.36-33.97-4.93-12.9-11.59-25.1-19.44-37.35-.03-.04-.05-.08-.08-.12C492.64,15.91,440.38-4.06,376.24.68c-30.96,2.29-57.12,17.88-81.52,35.79-7.95,5.84-14.71,7-22.33.33C225.19-4.59,134.36-15.1,73.32,28.41c-28.13,20.05-50.58,47.31-61.94,80.16C1.79,136.29,0,165.1,0,194.04h0v228.56h95.75c.07-48.15.07-96.3,0-144.45-.04-28.03-.11-56.06-.2-84.1-.06-19.85,1-40.16,9.68-57.84,10.91-22.21,37.34-35.48,61.38-36.34,29.14-1.04,56.01,19.95,62.9,48.19,4.4,18.03,2.57,39.47,2.89,58.07.11,6.36.18,12.72.26,19.08v197.39h98.68c-.88-114.92-.33-202.96-.39-249.62-.01-7.92.17-28.24,12.92-46.76,23.8-34.58,70.42-39.08,100.13-9.43,12.13,12.11,16.59,27.92,17.78,44.27,3.46,47.32.64,96.19,18.61,141.08,15.68,39.14,42.84,73.34,77.31,97.6v-123.06c0-46.08,3.93-92.33-.96-138.3Z"/>
    </g>
  </g>
</svg>
